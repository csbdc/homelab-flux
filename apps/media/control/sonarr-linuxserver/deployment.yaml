apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: sonarr-linuxserver
  name: deployment
spec:
  selector:
    matchLabels:
      app: sonarr-linuxserver
  template:
    metadata:
      labels:
        app: sonarr-linuxserver
    spec:
      containers:
        - name: arr-app
          image: lscr.io/linuxserver/sonarr:latest
          env:
            - name: PUID
              value: "10000"
            - name: PGID
              value: "10000"
          livenessProbe:
            httpGet:
              port: 8989
          readinessProbe:
            httpGet:
              port: 8989
          ports:
            - containerPort: 8989
              name: http
              protocol: TCP
          volumeMounts:
            - name: media-data
              mountPath: /tv
      volumes:
        - name: config
          secret:
            secretName: sonarr-linuxserver-media-config
            items:
              - key: config.xml
                path: config.xml
        - name: app-data
          persistentVolumeClaim:
            claimName: sonarr-linuxserver-media-pvc
        - name: media-data
          nfs:
            server: ${server}
            path: ${path}/tv
