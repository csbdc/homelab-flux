apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gpu-device-plugin
  namespace: default
spec:
  suspend: false
  install:
    createNamespace: true
  targetNamespace: intel
  interval: 10m
  chart:
    spec:
      chart: intel-device-plugins-operator
      sourceRef:
        kind: HelmRepository
        name: intel
        namespace: default
      interval: 10m
  values:
    manager:
      devices:
        gpu: true
